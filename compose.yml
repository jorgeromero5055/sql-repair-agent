services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sqlrepair
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

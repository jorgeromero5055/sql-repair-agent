[project]
name = "sql-repair-agent-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "boto3>=1.43.78",
    "fastapi",
    "google-genai>=2.19.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest", "httpx2"]

[tool.pytest.ini_options]
pythonpath = ["."]

name: test

on:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/placeholder
      AWS_DEFAULT_REGION: us-east-1
      AGENT_DB_PASSWORD: ci-test-password-123
      AGENT_DATABASE_URL: postgresql://agent_ro:ci-test-password-123@localhost:5432/test
      GEMINI_API_KEY: placeholder-not-used-in-tests

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --frozen

      - run: uv run alembic upgrade head

      - run: uv run pytest

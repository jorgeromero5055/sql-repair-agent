name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::020528754559:role/sql-repair-api-github-deploy
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: api
        run: |
          docker build --platform linux/amd64 --provenance=false \
            -f Dockerfile.lambda \
            -t 020528754559.dkr.ecr.us-east-1.amazonaws.com/sql-repair-api:latest .
          docker push 020528754559.dkr.ecr.us-east-1.amazonaws.com/sql-repair-api:latest

      - uses: astral-sh/setup-uv@v5

      - name: Run database migrations
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name sql-repair-api \
            --image-uri 020528754559.dkr.ecr.us-east-1.amazonaws.com/sql-repair-api:latest

      - name: Update worker
        run: |
          aws lambda update-function-code \
            --function-name sql-repair-worker \
            --image-uri 020528754559.dkr.ecr.us-east-1.amazonaws.com/sql-repair-api:latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: web
        run: |
          API_URL=$(aws apigatewayv2 get-apis --query "Items[?Name=='sql-repair-api'].ApiEndpoint" --output text)
          echo "Building against $API_URL"
          npm ci
          VITE_API_URL="$API_URL" npm run build

      - name: Upload to S3
        working-directory: web
        run: aws s3 sync dist/ s3://sql-repair-agent-web-020528754559 --delete

      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[0].DomainName=='sql-repair-agent-web-020528754559.s3.us-east-1.amazonaws.com'].Id" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

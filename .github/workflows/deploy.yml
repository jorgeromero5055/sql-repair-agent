name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,base64,json;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print('SUB:',d['sub']);print('AUD:',d['aud']);print('ISS:',d['iss'])" "$TOKEN"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::020528754559:role/sql-repair-api-github-deploy
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: api
        run: |
          docker build --platform linux/amd64 --provenance=false \
            -f Dockerfile.lambda \
            -t 020528754559.dkr.ecr.us-east-1.amazonaws.com/sql-repair-api:latest .
          docker push 020528754559.dkr.ecr.us-east-1.amazonaws.com/sql-repair-api:latest

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name sql-repair-api \
            --image-uri 020528754559.dkr.ecr.us-east-1.amazonaws.com/sql-repair-api:latest
